<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Highlight Reel Maker</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="stylesheet" href="/static/experience.css" />
  </head>
  <body>
    <main class="shell">
      <section class="tool">
        <div class="mast">
          <div>
            <p class="eyebrow">Project 10</p>
            <h1>AI Highlight Reel Maker</h1>
          </div>
          <div class="status" id="health" role="status" aria-live="polite">Checking</div>
        </div>

        <form id="uploadForm" class="upload" autocomplete="off">
          <label class="drop" id="dropZone">
            <input
              id="file"
              name="file"
              type="file"
              accept="video/*,audio/*,.txt,.md,.srt,.vtt"
              aria-describedby="fileRequirements fileMeta"
            />
            <span class="drop-title" id="fileLabel">Choose long-form footage</span>
            <span class="drop-meta" id="fileRequirements">Drop a video, audio file, or transcript here</span>
            <span class="file-meta" id="fileMeta" aria-live="polite">No file selected</span>
          </label>
          <div class="timeline" id="timeline" aria-hidden="true"></div>
          <div class="controls">
            <label>
              <span>Clips</span>
              <input id="clipCount" name="clip_count" type="number" min="1" max="12" value="5" />
            </label>
            <label>
              <span>Platform</span>
              <select id="platform" name="platform">
                <option>YouTube Shorts</option>
                <option>TikTok</option>
                <option>Instagram Reels</option>
                <option>Sports</option>
                <option>Podcast</option>
              </select>
            </label>
            <label class="toggle">
              <input id="captions" name="captions" type="checkbox" checked />
              <span>Captions</span>
            </label>
            <label class="toggle">
              <input id="demoMode" name="demo_mode" type="checkbox" />
              <span>Demo mode</span>
            </label>
            <button type="submit" id="submitBtn">Find Highlights</button>
          </div>
          <p class="analysis-status" id="analysisStatus" role="status" aria-live="polite">
            Ready to analyze your source locally or in demo mode.
          </p>
          <div class="form-error hidden" id="formError" role="alert"></div>
        </form>
      </section>

      <section id="result" class="result hidden" tabindex="-1" aria-labelledby="status">
        <div class="result-head">
          <div>
            <p class="eyebrow">Edit Pack</p>
            <h2 id="status">Highlights</h2>
          </div>
          <a id="edlLink" class="button secondary" href="#">EDL</a>
        </div>
        <div id="warnings" class="warnings hidden" role="status"></div>
        <div id="clips" class="clips"></div>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
